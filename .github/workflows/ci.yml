name: CI

# This is the CI gate, not the deploy trigger. Vercel and Render both watch
# this repo's `main` branch directly via their own GitHub App integrations
# and deploy on push — see docs/DEPLOYMENT-GUIDE.md. Branch protection on
# `main` requiring this workflow to pass is what actually makes deploys
# test-gated (checks run on the PR before merge, not after).
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Server — lint & boot smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://localhost:27017/zerivon_ci
      JWT_ACCESS_SECRET: ci-only-secret-not-used-in-production-aaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-only-secret-not-used-in-production-bbbbbbbbbbbbbbbbbbbb
      COOKIE_SECRET: ci-only-secret-not-used-in-production-cccccccccccccccccccccc
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: "111111111111111"
      CLOUDINARY_API_SECRET: ci-placeholder-secret-value
      SITE_URL: https://www.zerivon.in

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run verify:models

      - name: Boot the server and check /api/health
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server is up and healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
