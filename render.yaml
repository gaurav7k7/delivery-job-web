services:
  - type: web
    name: zerivon-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT itself (defaults to 10000) — not declared here.
      #
      # Everything below is a secret or deployment-specific value — set once
      # in the Render dashboard (Environment tab), not committed here.
      # See docs/DEPLOYMENT-GUIDE.md for the full list and where each value
      # comes from.
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: COOKIE_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: REDIS_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
